title: Oracle EBS Service Account Discovery Commands (CVE-2025-61882)
id: 6a1f2c10-5150-4e01-9b61-000000000002
status: experimental
description: |
  Detects host/network discovery commands executed by the EBS service account
  (applmgr) whose parent is the Java application server (post-exploitation recon).
  Pre-disclosure class: G (generic).
author: Jaden Harris (CAP 5150)
date: 2026-10-08
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1016
  - attack.t1033
logsource:
  product: linux
  category: process_creation
detection:
  selection_user:
    User: 'applmgr'
  selection_parent:
    ParentImage|endswith: '/java'
  selection_cmd:
    Image|endswith:
      - '/id'
      - '/whoami'
      - '/uname'
      - '/hostname'
      - '/ifconfig'
      - '/ip'
      - '/netstat'
      - '/ps'
  condition: selection_user and selection_parent and selection_cmd
falsepositives:
  - Monitoring agents running under applmgr (allow-list by parent)
level: high
